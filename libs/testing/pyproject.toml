[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-testing"
version = "0.1.0"
description = "Test doubles and testing utilities for Verichron"
requires-python = "==3.14.*"
dependencies = [
    "psycopg2>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
