[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-etl-run"
version = "0.1.0"
description = "Shared per-file/per-record success-and-failure accounting for the extractor pipeline"
requires-python = "==3.14.*"
dependencies = [
    "verichron-contracts",
]

[tool.uv.sources]
verichron-contracts = { workspace = true }

[tool.setuptools]
py-modules = ["etl_run"]