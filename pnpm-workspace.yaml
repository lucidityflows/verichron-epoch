packages:
  - 'packages/*'
  - 'apps/*'
  - 'libs/*'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

nodeLinker: hoisted
publicHoistPattern:
  - '*'


catalog:
  # Compiler — pinned exact, not caret. typescript-eslint's peer range
  # (>=4.8.4 <6.1.0) hard-blocks TS7 until 7.1 ships a stable API, so we
  # want an explicit version bump here, not an implicit one via ^.
  
  # Node/pg toolchain shared across the TypeScript control-plane packages.
  # Was pinned to ^20.19.43 with an open question about whether it should
  # track engines.node instead (apps/epoch and apps/processor both declare
  # "engines": {"node": ">=24.0.0"} and independently override this catalog
  # entry with @types/node ^24.0.0 to match). Resolved: bump the catalog
  # itself to the 24.x line so there's one answer, not packages quietly
  # diverging from what every other consumer pins.
  '@types/node': ^24.13.3
  '@types/pg': ^8.23.0
  '@types/react': ^19.2.5
  '@types/react-dom': ^19.2.5
  '@typescript-eslint/eslint-plugin': ^8.68.0
  '@typescript-eslint/parser': ^8.68.0
  '@vitejs/plugin-react': ^4.7.0
  node-linker: ^1.0.1
  electron: ^44.0.0
  # Lint stack — must move together (eslint9+ flat config <-> typescript-eslint8)
  eslint: ^10.9.1
  pg: ^8.23.0

  # epoch renderer
  react: ^19.2.5
  react-dom: ^19.2.5
  tsx: ^4.23.12
  typescript: 6.0.3
  vite: ^5.4.0 # or ^6.x — plugin-vite@7.11.2 is built against vite@^5.0.12; check if a 6.x line is confirmed compatible before jumping there
  dotenv: ^18.0.3
  # Virtualized data tables (RunsView, RecordsView) + virtualized lists
  # (IocsView) -- one pin, one place, per this workspace's existing catalog
  # convention (see the header comment above for why: no consumer should
  # independently drift a version).
  "@tanstack/react-table": "^9.2.4"
  "@tanstack/react-virtual": "^3.14.12"

  # Shared schema layer (packages/contracts) — zod4, single source of truth
  # for every consumer (processor, orchestrator, etl-db-writer, epoch).
  zod: ^4.4.3

onlyBuiltDependencies:
  - electron

envFiles:
  - .env