[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-epoch"
version = "0.1.0"
description = "Privacy-first local desktop forensic client and incident response orchestration engine"
requires-python = "==3.14.*"
dependencies = [
    "verichron-contracts",
    "verichron-etl-db-writer",
    "verichron-indicators",
    "verichron-runtime-env",
    "verichron-etl-run",
    "verichron-testing",
    "verichron-crash",
    "verichron-ileapp-bridge",
    "verichron-analysis",
    "verichron-indicator-match",
    "verichron-entities",
    "verichron-indicator-registry",
    "verichron-reporting",
    "pytest>=8.0",
    "jsonschema>=4.0",
    "requests>=2.31",
    # The backup decrypt and iLEAPP are not workspace dependencies: each runs
    # from its own pinned environment under tools/ (EPOCH-458, EPOCH-489).
    "pyyaml>=6",
]

[tool.setuptools]
py-modules = []

[tool.uv]
# The interpreter comes from .python-version and is always a uv-managed
# CPython build (which ships its development headers); a system Python is
# never used, so every machine and CI run the same interpreter (EPOCH-458).
python-preference = "only-managed"
required-version = ">=0.12.23,<0.13"

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/etl-db-writer",
    "packages/indicators",
    "libs/*",
    "apps/extractors/*",
    "apps/analysis",
    "apps/indicator_registry",
    "apps/reporting"
]
# etl-db-reader is a pure TypeScript/Node package (@verichron/db-reader) with no
# Python source at all -- it belongs to the pnpm workspace, not this one.
# The packages/* glob above would otherwise sweep it in.
exclude = [
    "packages/etl-db-reader",
]
# tools/decrypt and tools/ileapp are separate uv projects with their own
# lockfiles, not workspace members, so each tool's pins stay its own.

[tool.uv.sources]
verichron-contracts = { workspace = true }
verichron-etl-db-writer = { workspace = true }
verichron-indicators = { workspace = true }
verichron-runtime-env = { workspace = true }
verichron-etl-run = { workspace = true }
verichron-testing = { workspace = true }
verichron-crash = { workspace = true }
verichron-ileapp-bridge = { workspace = true }
verichron-analysis = { workspace = true }
verichron-indicator-match = { workspace = true }
verichron-entities = { workspace = true }
verichron-indicator-registry = { workspace = true }
verichron-reporting = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "scripts", "apps"]
norecursedirs = ["iLEAPP", "node_modules", ".venv", "dist", ".git", "infra"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["tools/ileapp/iLEAPP"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.17.0",
]
