name: Lab PostgreSQL and Python build

# The Lab bundle's PostgreSQL (EPOCH-477): built from the pinned source in the
# pinned Debian 13 container, then checked moved, socket-only, and with every
# migration applied. Then the bundle's Python parts (EPOCH-439): the runtime
# environment with psycopg2 built against that libpq, our source, and the
# decrypt and iLEAPP each in its own environment, all checked moved. It
# compiles PostgreSQL, so it runs only when the builds, the migrations, the
# Python dependencies, or the uv and Python versions (mise.toml,
# .python-version) change.

on:
  push:
    branches: [main]
    paths:
      - "tools/postgres/**"
      - "tools/runtime/**"
      - "tools/decrypt/**"
      - "tools/ileapp/**"
      - "mise.toml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "**/pyproject.toml"
      - "packages/etl-db-writer/migrations/**"
      - ".github/workflows/postgres-build.yml"
  pull_request:
    paths:
      - "tools/postgres/**"
      - "tools/runtime/**"
      - "tools/decrypt/**"
      - "tools/ileapp/**"
      - "mise.toml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "**/pyproject.toml"
      - "packages/etl-db-writer/migrations/**"
      - ".github/workflows/postgres-build.yml"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # iLEAPP, at the commit this one records, goes into the bundle.
          submodules: recursive

      - name: Build PostgreSQL from source
        run: tools/postgres/build.sh "$RUNNER_TEMP/pg"

      - name: Check it moved, socket-only, with every migration
        run: tools/postgres/check.sh "$RUNNER_TEMP/pg"

      - name: Build the Python environments, source and tools beside it
        run: tools/runtime/build.sh "$RUNNER_TEMP/pg"

      - name: Check them moved, with a decoy at the old path
        run: tools/runtime/check.sh "$RUNNER_TEMP/pg"
