name: Lab bundle parts build

# The Lab bundle's PostgreSQL (EPOCH-477): built from the pinned source in the
# pinned Debian 13 container, then checked moved, socket-only, and with every
# migration applied. Then the bundle's Python parts (EPOCH-439): the runtime
# environment with psycopg2 built against that libpq, our source, and the
# decrypt and iLEAPP each in its own environment, all checked moved. Then the
# services (EPOCH-478): the orchestrator and processor compiled and run by the
# bundled Node, checked moved with nothing on PATH but the base system. Then
# the iPhone tools and sqlite3 (EPOCH-472), checked the same way. It
# compiles PostgreSQL, so it runs only when a part's build or what it includes
# changes: the migrations, the Python or Node dependencies, the services and
# packages they include, or the uv, Python and Node versions (mise.toml,
# .python-version).

on:
  push:
    branches: [main]
    paths:
      - "tools/postgres/**"
      - "tools/runtime/**"
      - "tools/iphone/**"
      - "apps/epoch/src/main/tools/device-backup/ios/toolchain/pins.ts"
      - "tools/services/**"
      - "apps/orchestrator/**"
      - "apps/processor/**"
      - "apps/dbserver/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tools/decrypt/**"
      - "tools/ileapp/**"
      - "mise.toml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "**/pyproject.toml"
      - "packages/etl-db-writer/migrations/**"
      - ".github/workflows/postgres-build.yml"
  pull_request:
    paths:
      - "tools/postgres/**"
      - "tools/runtime/**"
      - "tools/iphone/**"
      - "apps/epoch/src/main/tools/device-backup/ios/toolchain/pins.ts"
      - "tools/services/**"
      - "apps/orchestrator/**"
      - "apps/processor/**"
      - "apps/dbserver/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tools/decrypt/**"
      - "tools/ileapp/**"
      - "mise.toml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "**/pyproject.toml"
      - "packages/etl-db-writer/migrations/**"
      - ".github/workflows/postgres-build.yml"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # iLEAPP, at the commit this one records, goes into the bundle.
          submodules: recursive

      - name: Build PostgreSQL from source
        run: tools/postgres/build.sh "$RUNNER_TEMP/pg"

      - name: Check it moved, socket-only, with every migration
        run: tools/postgres/check.sh "$RUNNER_TEMP/pg"

      - name: Build the Python environments, source and tools beside it
        run: tools/runtime/build.sh "$RUNNER_TEMP/pg"

      - name: Check them moved, with a decoy at the old path
        run: tools/runtime/check.sh "$RUNNER_TEMP/pg"

      # Node and pnpm at mise.toml's versions, for compiling the services.
      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Build the services and the Node that runs them
        run: tools/services/build.sh "$RUNNER_TEMP/pg"

      - name: Check them moved, with nothing on PATH but the base system
        run: tools/services/check.sh "$RUNNER_TEMP/pg"

      # The iPhone tools a pull runs and sqlite3, from their pinned sources (EPOCH-472).
      - name: Build the iPhone tools and sqlite3
        run: tools/iphone/build.sh "$RUNNER_TEMP/pg"

      - name: Check them moved, loading only the base system from outside the bundle
        run: tools/iphone/check.sh "$RUNNER_TEMP/pg"
