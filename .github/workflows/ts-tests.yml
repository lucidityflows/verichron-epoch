name: TS Tests

# EPOCH-401: first TypeScript test job in the repo. Scoped to the processor and
# its workspace dependencies (the `...` filter) so the Electron app's install
# isn't pulled into every run. Widen the filter as other packages gain tests.
#
# Linux only, by decision (2026-10-07): the macOS-specific inputs the evidence
# manifest must be invariant to (NFD filenames, `\` separators) are simulated
# in apps/processor/src/utils/manifest.test.ts rather than run on a macOS
# runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      # The etl-db-reader tests create and drop their own throwaway database
      # on this server (EPOCH-403), so this role must be allowed CREATE DATABASE.
      TEST_DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verichron_ci
          POSTGRES_USER: verichron_ci
          POSTGRES_PASSWORD: verichron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verichron_ci -d verichron_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node, pnpm and uv at the versions pinned in mise.toml (EPOCH-458).
      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter verichron-epoch --filter "@verichron/processor..." --filter "@verichron/etl-db-writer..." --filter "@verichron/etl-db-reader..." --filter "@verichron/orchestrator..."

      # EPOCH-469: every TypeScript file in the repo, the desktop app included,
      # in the layout .prettierrc.json gives it.
      - name: Check formatting
        run: pnpm format:check

      # The processor resolves @verichron/contracts through its built dist/.
      - name: Build contracts
        run: pnpm --filter @verichron/contracts build

      - name: Typecheck
        run: pnpm --filter @verichron/processor typecheck

      - name: Test
        run: pnpm --filter @verichron/processor test

      - name: Typecheck etl-db-writer
        run: pnpm --filter @verichron/etl-db-writer typecheck

      - name: Test etl-db-writer
        run: pnpm --filter @verichron/etl-db-writer test

      - name: Typecheck etl-db-reader
        run: pnpm --filter @verichron/etl-db-reader typecheck

      - name: Test etl-db-reader (real Postgres)
        run: pnpm --filter @verichron/etl-db-reader test

      - name: Typecheck orchestrator
        run: pnpm --filter @verichron/orchestrator typecheck

      # EPOCH-404: pre-flight registration, evidence-keyed resume and the
      # completeness predicate, against a throwaway database on this server.
      - name: Test orchestrator (real Postgres)
        run: pnpm --filter @verichron/orchestrator test
