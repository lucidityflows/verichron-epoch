name: TS Tests

# EPOCH-401: first TypeScript test job in the repo. Each package is installed
# with its workspace dependencies (the `...` filter). EPOCH-454 adds the desktop
# app; its install skips Electron's binary, which no step here launches.
#
# Linux only, by decision (2026-10-07): the macOS-specific inputs the evidence
# manifest must be invariant to (NFD filenames, `\` separators) are simulated
# in apps/processor/src/utils/manifest.test.ts rather than run on a macOS
# runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      # The etl-db-reader tests create and drop their own throwaway database
      # on this server (EPOCH-403), so this role must be allowed CREATE DATABASE.
      TEST_DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: verichron_ci
          POSTGRES_USER: verichron_ci
          POSTGRES_PASSWORD: verichron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verichron_ci -d verichron_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node, pnpm and uv at the versions pinned in mise.toml (EPOCH-458).
      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --filter verichron-epoch --filter "@verichron/processor..." --filter "@verichron/etl-db-reader..." --filter "@verichron/orchestrator..." --filter "@verichron/dbserver..." --filter "@verichron/epoch..."

      # EPOCH-469: every TypeScript file in the repo, the desktop app included,
      # in the layout .prettierrc.json gives it.
      - name: Check formatting
        run: pnpm format:check

      # The processor resolves @verichron/contracts through its built dist/.
      - name: Build contracts
        run: pnpm --filter @verichron/contracts build

      - name: Typecheck contracts tests
        run: pnpm --filter @verichron/contracts typecheck:tests

      # EPOCH-570: the task log's entries, the producers' events and the sanitizer.
      - name: Test contracts
        run: pnpm --filter @verichron/contracts test

      - name: Typecheck
        run: pnpm --filter @verichron/processor typecheck

      - name: Typecheck processor tests
        run: pnpm --filter @verichron/processor typecheck:tests

      # The orchestrator CLI validates the workspace's Python environment
      # before it runs anything (EPOCH-456), and the processor reads a real
      # interpreter's environment (EPOCH-439); uv builds it at the version
      # .python-version pins.
      # psycopg2 is built from source against libpq (EPOCH-439, B4).
      - name: Install libpq headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python environment
        run: uv sync --locked

      - name: Test
        run: pnpm --filter @verichron/processor test

      - name: Typecheck etl-db-reader
        run: pnpm --filter @verichron/etl-db-reader typecheck

      - name: Typecheck etl-db-reader tests
        run: pnpm --filter @verichron/etl-db-reader typecheck:tests

      - name: Test etl-db-reader (real Postgres)
        run: pnpm --filter @verichron/etl-db-reader test

      - name: Typecheck orchestrator
        run: pnpm --filter @verichron/orchestrator typecheck

      - name: Typecheck orchestrator tests
        run: pnpm --filter @verichron/orchestrator typecheck:tests

      # EPOCH-404: pre-flight registration, evidence-keyed resume and the
      # completeness predicate, against a throwaway database on this server.
      - name: Test orchestrator (real Postgres)
        run: pnpm --filter @verichron/orchestrator test

      # The Lab bundle's database server (EPOCH-477); its server runs are
      # checked from a built bundle in postgres-build.yml.
      - name: Typecheck database server
        run: pnpm --filter @verichron/dbserver typecheck

      - name: Typecheck database server tests
        run: pnpm --filter @verichron/dbserver typecheck:tests

      - name: Test database server
        run: pnpm --filter @verichron/dbserver test

      # The workspace lock, which the processor, the orchestrator and the
      # database server take (EPOCH-415, EPOCH-477).
      - name: Typecheck workspace lock tests
        run: pnpm --filter @verichron/workspace-lock typecheck:tests

      - name: Test workspace lock
        run: pnpm --filter @verichron/workspace-lock test

      # EPOCH-454: the desktop app reads the reader through its built dist/.
      - name: Build etl-db-reader
        run: pnpm --filter @verichron/etl-db-reader build

      - name: Typecheck app
        run: pnpm --filter @verichron/epoch typecheck

      # EPOCH-571: errors fail the job, so they can't build up unseen again.
      # Warnings are reported, not failed: today's three are the React
      # Compiler skipping components built on TanStack Virtual.
      - name: Lint app
        run: pnpm --filter @verichron/epoch lint

      - name: Build app (main, preload, renderer)
        run: pnpm --filter @verichron/epoch build:vite

      # Main-process and IPC tests in Node (the IPC handlers against a
      # throwaway database on this server); renderer tests in jsdom.
      - name: Test app
        run: pnpm --filter @verichron/epoch test
