name: Python Tests

# VER-18: no Python CI existed before this. .github/workflows/release-tools.yml
# only builds libimobiledevice binaries on release -- it never runs pytest.
# This workflow gates on the test suite that already exists and already
# catches real incidents (enum/schema drift, ingest-transaction atomicity,
# extractor contract violations) but previously only ran when a developer
# remembered to run it locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # The administrative identity (the service's superuser): migrations and
      # provisioning only (EPOCH-562).
      ADMIN_DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
      # The runtime login provisioning creates, distinct from the admin.
      DB_APP_USER: verichron_ci_app
      DB_APP_PASSWORD: verichron_ci_app
      # Separate name on purpose: the postgres test backend TRUNCATEs tables,
      # so it only ever reads this, never DATABASE_URL (libs/testing/testing/pg_real.py).
      TEST_DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: verichron_ci
          POSTGRES_USER: verichron_ci
          POSTGRES_PASSWORD: verichron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verichron_ci -d verichron_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # scripts/test_tool_environments.py reads the iLEAPP submodule's
          # requirements.txt to check tools/ileapp against it.
          submodules: recursive

      # Node, pnpm and uv at the versions pinned in mise.toml (EPOCH-458).
      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4

      # psycopg2 is built from source against libpq (EPOCH-439, B4).
      - name: Install libpq headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      # uv takes the interpreter from .python-version (a uv-managed CPython).
      - name: Sync workspace
        run: uv sync --locked --all-extras

      - name: Audit pinned iLEAPP source headers
        run: uv run python scripts/audit_ileapp_entity_headers.py

      # The shipped environment: the lockfile with no dependency groups
      # (EPOCH-439, B5); scripts/test_runtime_environment.py runs against it.
      - name: Build the runtime environment
        run: mise run runtime-env

      - name: Refuse forensic output in tracked files
        run: uv run python scripts/check_no_forensic_output.py --tracked

      - name: Ruff lint
        run: uv run ruff check packages libs apps scripts tools

      - name: Ruff format
        run: uv run ruff format --check packages libs apps scripts tools

      - name: Pyright
        run: uv run pyright

      - name: Build the decrypt tool's environment
        run: uv sync --locked --project tools/decrypt

      # The decrypt runs from its own environment, so Pyright checks it
      # against that environment (tools/decrypt/pyrightconfig.json).
      - name: Pyright (decrypt tool)
        run: uv run pyright -p tools/decrypt

      # The iLEAPP end-to-end test runs the real iLEAPP from this environment
      # (VER-16). Building it compiles two native packages; the runner has a
      # compiler. --locked also fails on a stale lockfile.
      - name: Build iLEAPP's environment
        run: uv sync --locked --project tools/ileapp

      - name: Apply PostgreSQL migrations
        run: uv run python packages/etl-db-writer/migrate.py

      - name: Verify PostgreSQL migrations are repeatable
        run: uv run python packages/etl-db-writer/migrate.py

      # The runtime login, as `mise run db` makes it, twice to show it reruns.
      - name: Provision the runtime login
        run: |
          uv run python packages/etl-db-writer/provision_roles.py
          uv run python packages/etl-db-writer/provision_roles.py

      - name: Run pytest
        run: uv run pytest -q
        # testpaths / norecursedirs already scoped correctly in root
        # pyproject.toml ([tool.pytest.ini_options]): packages, scripts,
        # apps; iLEAPP/node_modules/.venv/dist/.git/infra excluded. The
        # transaction-boundary suites (test_db_writer.py,
        # test_extractor_ingest_atomicity.py) run every test twice: once on
        # PgDouble, once on the postgres service above via TEST_DATABASE_URL.
