name: Python Tests

# VER-18: no Python CI existed before this. .github/workflows/release-tools.yml
# only builds libimobiledevice binaries on release -- it never runs pytest.
# This workflow gates on the test suite that already exists and already
# catches real incidents (enum/schema drift, ingest-transaction atomicity,
# extractor contract violations) but previously only ran when a developer
# remembered to run it locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verichron_ci
          POSTGRES_USER: verichron_ci
          POSTGRES_PASSWORD: verichron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verichron_ci -d verichron_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Kept recursive for parity with scripts/bootstrap-dev.sh's dev
          # setup. Not currently required by any test file (nothing in the
          # suite imports the vendored iLEAPP submodule's contents at
          # collection time) -- if this step becomes a meaningful chunk of
          # CI time, it's safe to drop to `submodules: false` and revisit
          # only if a future test actually needs it populated.
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      # uv resolves its own interpreter per pyproject's requires-python
      # (>=3.12); no separate actions/setup-python step needed.
      - name: Sync workspace
        run: uv sync --all-extras
        # NOTE (VER-18 open risk): root pyproject.toml depends on `mvt`,
        # which can pull in binary/system deps (libusb-adjacent tooling)
        # not present on a bare ubuntu-latest runner. If this step fails
        # while a local `uv sync` succeeds, start here -- it's a system
        # package gap, not a Python/test problem. apt-get steps to add
        # missing system libs go directly above this step once identified.

      - name: Apply PostgreSQL migrations
        run: uv run python packages/etl-db-writer/migrate.py --db-url "$DATABASE_URL"

      - name: Verify PostgreSQL migrations are repeatable
        run: uv run python packages/etl-db-writer/migrate.py --db-url "$DATABASE_URL"

      - name: Run pytest
        run: uv run pytest -q
        # testpaths / norecursedirs already scoped correctly in root
        # pyproject.toml ([tool.pytest.ini_options]): packages, scripts,
        # apps; iLEAPP/node_modules/.venv/dist/.git/infra excluded. The
        # transaction-boundary tests currently use PgDouble; PostgreSQL
        # integration coverage will be added alongside the evidence schema.
