# Dependency update pull requests (EPOCH-458). Exact pins stay current only if
# something proposes the updates; review each one like any other change.
#
# Not covered here: the tool versions in mise.toml (Node, pnpm, uv) and Python
# in .python-version, which are updated by hand, together with CI.
version: 2
updates:
  # pnpm workspace (pnpm-lock.yaml). Electron gets its own pull requests: every
  # patch carries Chromium security fixes and each needs an app smoke test.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      electron:
        patterns: ["electron"]
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["electron"]

  # The uv workspace and the two pinned tool environments.
  - package-ecosystem: uv
    directories: ["/", "/tools/decrypt", "/tools/ileapp"]
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Workflow actions (pinned to commit SHAs).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The iLEAPP submodule. A bump also requires updating tools/ileapp to match its
  # requirements.txt; scripts/test_tool_environments.py fails until it does.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
