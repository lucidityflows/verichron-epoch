[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-indicator-match"
version = "0.1.0"
description = "Stage: matches one evidence's facts against one registered indicator set (EPOCH-491)."
requires-python = "==3.14.*"
dependencies = [
    "psycopg2-binary>=2.9",
    "verichron-contracts",
    "verichron-etl-db-writer",
    "verichron-etl-run",
    "verichron-indicators",
    "verichron-runtime-env",
]

[tool.uv.sources]
verichron-contracts = { workspace = true }
verichron-etl-db-writer = { workspace = true }
verichron-etl-run = { workspace = true }
verichron-indicators = { workspace = true }
verichron-runtime-env = { workspace = true }

[tool.setuptools]
py-modules = []
