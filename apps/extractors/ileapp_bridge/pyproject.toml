[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-ileapp-bridge"
version = "0.1.0"
description = "Extractor: bridges iLEAPP extraction output into forensic_records."
requires-python = "==3.14.*"
dependencies = [
    "psycopg2>=2.9",
    "verichron-runtime-env",
    "verichron-etl-run",
    "verichron-etl-db-writer",
    "verichron-contracts",
    # iLEAPP itself runs from its own pinned environment, tools/ileapp
    # (EPOCH-458); its dependencies are declared there, not here.
]

[tool.uv.sources]
verichron-runtime-env = { workspace = true }
verichron-etl-run = { workspace = true }
verichron-etl-db-writer = { workspace = true }
verichron-contracts = { workspace = true }

[tool.setuptools]
packages = ["ileapp_bridge"]

[tool.setuptools.package-dir]
ileapp_bridge = "."