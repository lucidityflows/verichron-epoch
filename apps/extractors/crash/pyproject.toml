[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-crash"
version = "0.1.0"
description = "Extractor: parses iOS .ips crash and telemetry files into forensic_records."
requires-python = "==3.14.*"
dependencies = [
    "psycopg2>=2.9",
    "verichron-runtime-env",
    "verichron-etl-run",
    "verichron-etl-db-writer",
    "verichron-contracts",
]

[tool.uv.sources]
verichron-runtime-env = { workspace = true }
verichron-etl-run = { workspace = true }
verichron-etl-db-writer = { workspace = true }
verichron-contracts = { workspace = true }

[tool.setuptools]
packages = ["crash"]

[tool.setuptools.package-dir]
crash = "."
