[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-reporting"
version = "0.1.0"
description = "Forensic investigation report generator"
requires-python = "==3.14.*"
dependencies = [
    "psycopg2>=2.9",
    "verichron-runtime-env",
    "verichron-contracts",
]

[tool.uv.sources]
verichron-runtime-env = { workspace = true }
verichron-contracts = { workspace = true }

[tool.setuptools]
packages = ["reporting"]

[tool.setuptools.package-dir]
reporting = "."
